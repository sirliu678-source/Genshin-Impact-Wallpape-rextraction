    const STORAGE_KEY = 'visumark_items_v10';

    function detectMediaType(url) {
      if (!url) return 'IMG';
      const cleanUrl = url.split('?')[0].toLowerCase();
      if (cleanUrl.endsWith('.webm') || cleanUrl.endsWith('.mp4')) return 'WEBM';
      if (cleanUrl.endsWith('.gif')) return 'GIF';
      return 'IMG';
    }

    function getDomain(url) {
      try {
        return new URL(url).hostname;
      } catch {
        return '直链网站';
      }
    }

    // 提取最短合法直链
    function extractUrlsFromRawText(rawText) {
      if (!rawText) return [];
      const regex = /https?:\/\/[a-zA-Z0-9\.\-_~:/?#\[\]@!$&'*+,;=%]+?\.(?:webm|webp|png)/gi;
      const rawMatches = rawText.match(regex) || [];

      const uniqueMap = new Map();
      rawMatches.forEach(rawUrl => {
        let clean = rawUrl.trim();
        const lastHttpIndex = clean.lastIndexOf('http');
        if (lastHttpIndex > 0) clean = clean.substring(lastHttpIndex);
        clean = clean.replace(/[,;)"'>]+$/, '');

        const lower = clean.toLowerCase();
        let ext = '';
        if (lower.endsWith('.webm')) ext = 'WEBM';
        else if (lower.endsWith('.webp')) ext = 'WEBP';
        else if (lower.endsWith('.png')) ext = 'PNG';

        if (ext && !uniqueMap.has(clean)) {
          const filename = clean.substring(clean.lastIndexOf('/') + 1);
          let title = '';
          let category = '立绘插画';
          let type = 'IMG';

          if (ext === 'WEBM') {
            title = `动效_${filename.slice(0, 10)}`;
            category = '动态壁纸';
            type = 'WEBM';
          } else if (ext === 'WEBP') {
            title = `WebP插画_${filename.slice(0, 10)}`;
            category = '立绘插画';
            type = 'IMG';
          } else {
            title = `PNG图片_${filename.slice(0, 10)}`;
            category = '静态美图';
            type = 'IMG';
          }

          uniqueMap.set(clean, {
            id: 'ext-' + Math.random().toString(36).substr(2, 9),
            url: clean,
            title: title,
            category: category,
            type: type,
            format: ext,
            checked: true
          });
        }
      });

      return Array.from(uniqueMap.values());
    }

    // 媒体预览渲染组件
    function MediaRenderer({ url, previewUrl, type, title, className = '', autoPlay = true }) {
      const [stage, setStage] = useState(0);
      const displayUrl = previewUrl?.trim() || url?.trim();
      const isVideo = type === 'WEBM' || displayUrl?.split('?')[0].toLowerCase().endsWith('.webm');

      useEffect(() => {
        setStage(0);
      }, [displayUrl]);

      if (!displayUrl || stage === 2) {
        return (
          <div className="w-full h-full bg-slate-900 flex flex-col items-center justify-center p-2 text-center">
            <span className="text-2xl">🖼️</span>
            <span className="text-[10px] text-slate-400 mt-1 line-clamp-1">{title || '无预览'}</span>
          </div>
        );
      }

      if (isVideo) {
        return (
          <video
            src={displayUrl}
            autoPlay={autoPlay}
            loop
            muted
            playsInline
            onError={() => setStage(2)}
            className={`w-full h-full object-cover ${className}`}
          />
        );
      }

      const currentSrc = stage === 0
        ? displayUrl
        : `https://images.weserv.nl/?url=${encodeURIComponent(displayUrl)}&default=transparent`;

      return (
        <img
          src={currentSrc}
          alt={title || "preview"}
          loading="lazy"
          onError={() => {
            if (stage === 0) setStage(1);
            else setStage(2);
          }}
          className={`w-full h-full object-cover ${className}`}
        />
      );
    }

    function App() {
      const [activeTab, setActiveTab] = useState('gallery');
      const [items, setItems] = useState(() => {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          return saved ? JSON.parse(saved) : INITIAL_RESOURCES;
        } catch {
          return INITIAL_RESOURCES;
        }
      });

      // 【核心功能新增】多级历史撤销栈（容错功能）
      const [historyStack, setHistoryStack] = useState([]);

      const [categories, setCategories] = useState(() => {
        try {
          const saved = localStorage.getItem(CATS_KEY);
          return saved ? JSON.parse(saved) : ['动态壁纸', '立绘插画', '静态美图', '常用推荐'];
        } catch {
          return ['动态壁纸', '立绘插画', '静态美图', '常用推荐'];
        }
      });

      const [activeCategory, setActiveCategory] = useState('ALL');
      const [searchQuery, setSearchQuery] = useState('');
      const [filterType, setFilterType] = useState('ALL');
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [activePreviewItem, setActivePreviewItem] = useState(null);
      const [selectedItemIds, setSelectedItemIds] = useState(new Set());
      const [isMultiSelectMode, setIsMultiSelectMode] = useState(false);
      const [copiedId, setCopiedId] = useState(null);
      const [batchFeedback, setBatchFeedback] = useState('');
      const [showUndoBtnInToast, setShowUndoBtnInToast] = useState(false);

      // 手动添加表单状态
      const [formData, setFormData] = useState({
        title: '',
        url: '',
        previewUrl: '',
        category: '动态壁纸',
        description: '',
        type: 'AUTO',
        isPinned: false
      });

      // 提取板块状态
      const [extractedItems, setExtractedItems] = useState([]);
      const [rawInputText, setRawInputText] = useState('');
      const [isDragging, setIsDragging] = useState(false);
      const fileInputRef = useRef(null);

      const [extractFilterFormat, setExtractFilterFormat] = useState('ALL');
      const [extractSearchQuery, setExtractSearchQuery] = useState('');
      const [extractCheckFilter, setExtractCheckFilter] = useState('ALL');

      useEffect(() => {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
        } catch (e) {}
      }, [items]);

      useEffect(() => {
        try {
          localStorage.setItem(CATS_KEY, JSON.stringify(categories));
        } catch (e) {}
      }, [categories]);

      // 保存快照至历史栈中（最多记录 30 步）
      const pushHistorySnapshot = (currentItemsState) => {
        setHistoryStack(prev => {
          const newStack = [...prev, JSON.parse(JSON.stringify(currentItemsState))];
          if (newStack.length > 30) newStack.shift();
          return newStack;
        });
      };

      // 执行“返回上一步 / 撤销”容错逻辑
      const handleUndo = () => {
        if (historyStack.length === 0) {
          setBatchFeedback('ℹ️ 当前没有可以撤销的更早历史操作');
          setShowUndoBtnInToast(false);
          setTimeout(() => setBatchFeedback(''), 3000);
          return;
        }

        const previousState = historyStack[historyStack.length - 1];
        setHistoryStack(prev => prev.slice(0, prev.length - 1));
        setItems(previousState);

        setBatchFeedback(`↶ 已成功返回上一步！已恢复 ${previousState.length} 个网址卡片状态。`);
        setShowUndoBtnInToast(false);
        setTimeout(() => setBatchFeedback(''), 4500);
      };

      // 监听全局 Ctrl + Z / Cmd + Z 撤销快捷键
      useEffect(() => {
        const handleKeyDown = (e) => {
          if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) {
            // 如果焦点在输入框/文本域内，优先使用默认的文本撤销
            if (['input', 'textarea'].includes(document.activeElement?.tagName?.toLowerCase())) {
              return;
            }
            e.preventDefault();
            handleUndo();
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [historyStack]);

      // 画廊列表过滤
      const filteredItems = useMemo(() => {
        return items.filter(item => {
          const matchCat = activeCategory === 'ALL' || item.category === activeCategory;
          const matchType = filterType === 'ALL' || item.type === filterType;
          const matchSearch = searchQuery.trim() === '' || 
            item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.url.toLowerCase().includes(searchQuery.toLowerCase());
          return matchCat && matchType && matchSearch;
        }).sort((a, b) => (b.isPinned ? 1 : 0) - (a.isPinned ? 1 : 0));
      }, [items, activeCategory, filterType, searchQuery]);

      // 提取结果动态筛选
      const filteredExtractedItems = useMemo(() => {
        return extractedItems.filter(item => {
          const matchFormat = extractFilterFormat === 'ALL' || item.format === extractFilterFormat;
          const matchCheck = extractCheckFilter === 'ALL' 
            ? true 
            : extractCheckFilter === 'CHECKED' ? item.checked : !item.checked;
          const matchSearch = extractSearchQuery.trim() === '' ||
            item.title.toLowerCase().includes(extractSearchQuery.toLowerCase()) ||
            item.url.toLowerCase().includes(extractSearchQuery.toLowerCase());
          return matchFormat && matchCheck && matchSearch;
        });
      }, [extractedItems, extractFilterFormat, extractCheckFilter, extractSearchQuery]);

      // 手动添加新网址（带历史快照记录）
      const handleSaveManualNew = (e) => {
        e.preventDefault();
        if (!formData.url.trim()) return;

        pushHistorySnapshot(items); // 记录上一步状态

        const effectiveMediaUrl = formData.previewUrl.trim() || formData.url.trim();
        const detected = detectMediaType(effectiveMediaUrl);
        const resolvedType = formData.type === 'AUTO' ? detected : formData.type;
        const fallbackTitle = getDomain(formData.url);

        const newItem = {
          id: 'res-' + Date.now(),
          title: formData.title.trim() || fallbackTitle,
          url: formData.url.trim(),
          previewUrl: formData.previewUrl.trim(),
          description: formData.description.trim() || `手动添加于 ${new Date().toLocaleDateString()}`,
          category: formData.category,
          type: resolvedType,
          isPinned: formData.isPinned,
          createdAt: new Date().toISOString().split('T')[0]
        };

        setItems([newItem, ...items]);
        setIsModalOpen(false);
        setFormData({
          title: '',
          url: '',
          previewUrl: '',
          category: categories[0] || '动态壁纸',
          description: '',
          type: 'AUTO',
          isPinned: false
        });
        setBatchFeedback(`✅ 成功添加新网址卡片：“${newItem.title}”`);
        setShowUndoBtnInToast(true);
        setTimeout(() => setBatchFeedback(''), 5000);
      };

      // 单个卡片删除（带历史快照记录）
      const handleDeleteItem = (id, title, e) => {
        e.stopPropagation();
        pushHistorySnapshot(items); // 记录上一步状态
        setItems(items.filter(i => i.id !== id));
        if (activePreviewItem?.id === id) setActivePreviewItem(null);

        setBatchFeedback(`🗑 已删除卡片：“${title}”`);
        setShowUndoBtnInToast(true);
        setTimeout(() => setBatchFeedback(''), 6000);
      };

      // 重置回预设（带历史快照记录）
      const handleResetDefault = () => {
        if (confirm('确认恢复为系统预设的 11 个网址？当前状态可随时点击“撤销”恢复。')) {
          pushHistorySnapshot(items);
          setItems(INITIAL_RESOURCES);
          setSelectedItemIds(new Set());
          setBatchFeedback('↺ 已恢复默认预设网址！');
          setShowUndoBtnInToast(true);
          setTimeout(() => setBatchFeedback(''), 5000);
        }
      };

      // 解析提取文本
      const handleParseText = (text) => {
        const results = extractUrlsFromRawText(text);
        setExtractedItems(results);
        if (results.length > 0) {
          setBatchFeedback(`🎯 成功解析提取出 ${results.length} 个以 webm / webp / png 结尾的最短网址！`);
        } else {
          setBatchFeedback(`⚠️ 未在内容中检测到包含 .webm、.webp 或 .png 的最短有效 http 网址。`);
        }
        setShowUndoBtnInToast(false);
        setTimeout(() => setBatchFeedback(''), 5000);
      };

      // 本地文件读取
      const handleFileUpload = (file) => {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const content = e.target.result;
          setRawInputText(content.slice(0, 1000) + '... (已读取文件全文)');
          handleParseText(content);
        };
        reader.readAsText(file, 'utf-8');
      };

      const toggleExtractedCheck = (id) => {
        setExtractedItems(extractedItems.map(item => 
          item.id === id ? { ...item, checked: !item.checked } : item
        ));
      };

      const toggleFilteredExtracted = (selectAll) => {
        const currentFilteredIds = new Set(filteredExtractedItems.map(i => i.id));
        setExtractedItems(extractedItems.map(item => {
          if (currentFilteredIds.has(item.id)) {
            return { ...item, checked: selectAll };
          }
          return item;
        }));
      };

      // 将提取的网址批量并入原网址库（带历史快照记录）
      const handleImportSelected = () => {
        const toImport = extractedItems.filter(i => i.checked);
        if (toImport.length === 0) {
          alert('请先勾选需要添加到库中的网址！');
          return;
        }

        const existingUrlSet = new Set(items.map(i => i.url));
        const newAdditions = [];

        toImport.forEach(item => {
          if (!existingUrlSet.has(item.url)) {
            newAdditions.push({
              id: 'res-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
              title: item.title,
              url: item.url,
              previewUrl: '',
              category: item.category,
              type: item.type,
              isPinned: false,
              description: '从文档自动提取并导入',
              createdAt: new Date().toISOString().split('T')[0]
            });
            existingUrlSet.add(item.url);
          }
        });

        if (newAdditions.length === 0) {
          alert('所选网址在库中均已存在，无需重复添加！');
          return;
        }

        pushHistorySnapshot(items); // 记录导入前状态，支持一键撤销
        setItems([...newAdditions, ...items]);
        setActiveTab('gallery');
        setBatchFeedback(`🎉 成功添加 ${newAdditions.length} 个提取网址！`);
        setShowUndoBtnInToast(true);
        setTimeout(() => setBatchFeedback(''), 6000);
      };

      // 下载资源
      const handleDownloadAsset = async (item, e) => {
        if (e) e.stopPropagation();
        const a = document.createElement('a');
        a.href = item.url;
        a.target = '_blank';
        a.download = `${item.title || '资源'}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBatchFeedback(`已触发 "${item.title}" 下载！`);
        setShowUndoBtnInToast(false);
        setTimeout(() => setBatchFeedback(''), 3000);
      };

      // 备份全部数据
      const handleExportBackup = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(items, null, 2));
        const a = document.createElement('a');
        a.setAttribute("href", dataStr);
        a.setAttribute("download", `VisuMark_备份_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setBatchFeedback("✅ 已将全部网址库保存为本地 JSON 备份文件！");
        setShowUndoBtnInToast(false);
        setTimeout(() => setBatchFeedback(''), 4000);
      };

      // 批量打开
      const handleBatchOpen = () => {
        const toOpen = isMultiSelectMode && selectedItemIds.size > 0
          ? items.filter(i => selectedItemIds.has(i.id))
          : filteredItems;

        if (toOpen.length === 0) {
          alert('当前筛选下没有可打开的网址！');
          return;
        }
        toOpen.forEach((item, index) => {
          setTimeout(() => window.open(item.url, '_blank'), index * 80);
        });
      };

      const copyUrl = (item, e) => {
        if (e) e.stopPropagation();

                              onClick={(e) => copyUrl(item, e)}
                              className="text-[11px] px-2 py-1 rounded bg-slate-800/80 text-slate-300 hover:text-white"
                            >
                              {copiedId === item.id ? '已复制' : '复制'}
                            </button>
                            <a
                              href={item.url}
                              target="_blank"
                              rel="noreferrer"
                              onClick={(e) => e.stopPropagation()}
                              className="text-[11px] px-2.5 py-1 rounded bg-indigo-600/30 text-indigo-200 hover:bg-indigo-600 hover:text-white"
                            >
                              打开 ↗
                            </a>
                            <button
                              onClick={(e) => handleDeleteItem(item.id, item.title, e)}
                              className="text-xs p-1 text-slate-500 hover:text-red-400 transition-colors"
                              title="删除卡片 (可随时按 Ctrl+Z 撤销恢复)"
                            >
                              🗑
                            </button>
                          </div>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* 手动添加新网址弹窗 Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm">
              <div className="glass-panel w-full max-w-lg rounded-3xl p-6 sm:p-7 border border-slate-700 shadow-2xl relative max-h-[90vh] overflow-y-auto">
                <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                  <h3 className="text-lg font-bold text-white flex items-center gap-2">
                    <span>✨</span> 手动添加新的图片 / 动图网址
                  </h3>
                  <button
                    onClick={() => setIsModalOpen(false)}
                    className="text-slate-400 hover:text-white text-base"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleSaveManualNew} className="mt-5 space-y-4">
                  <div>
                    <div className="flex items-center justify-between mb-1">
                      <label className="block text-xs font-medium text-slate-300">
                        图片/动图直链 或 目标网址 (URL) <span className="text-pink-500">*</span>
                      </label>
                      {formData.url && (
                        <a
                          href={formData.url}
                          target="_blank"
                          rel="noreferrer"
                          className="text-[11px] text-indigo-400 hover:underline"
                        >
                          测试访问 ↗
                        </a>
                      )}
                    </div>
                    <input
                      type="url"
                      required
                      placeholder="https://... (.webm, .webp, .png, .gif, .jpg 或任意网址)"
                      value={formData.url}
                      onChange={(e) => setFormData({ ...formData, url: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">
                      独立封面图链接 <span className="text-slate-500 text-[11px]">(选填：若上方为普通网页，可在此贴图片直链)</span>
                    </label>
                    <input
                      type="url"
                      placeholder="选填：https://... 封面图片直链"
                      value={formData.previewUrl}
                      onChange={(e) => setFormData({ ...formData, previewUrl: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  {(formData.url || formData.previewUrl) && (
                    <div className="p-3 rounded-xl bg-slate-950/80 border border-slate-800 flex items-center gap-3">
                      <div className="w-16 h-16 rounded-lg overflow-hidden bg-slate-900 flex-shrink-0 flex items-center justify-center border border-slate-800">
                        <MediaRenderer
                          url={formData.url}
                          previewUrl={formData.previewUrl}
                          type={formData.type === 'AUTO' ? detectMediaType(formData.previewUrl || formData.url) : formData.type}
                          title={formData.title || '静态预览'}
                        />
                      </div>
                      <div className="text-xs text-slate-400 min-w-0">
                        <p className="text-slate-200 font-medium truncate">
                          {formData.title || '正在预览中...'}
                        </p>
                        <p className="text-[11px] text-slate-500 mt-0.5">
                          自动识别类型：{detectMediaType(formData.previewUrl || formData.url)}
                        </p>
                      </div>
                    </div>
                  )}

                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">标题 / 资源名称</label>
                    <input
                      type="text"
                      placeholder="例：薇斯纳 / 视觉设计"
                      value={formData.title}
                      onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1">所属分类</label>
                      <select
                        value={formData.category}
                        onChange={(e) => setFormData({ ...formData, category: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-indigo-500"
                      >
                        {categories.map(c => <option key={c} value={c}>{c}</option>)}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-medium text-slate-300 mb-1">展示格式</label>
                      <select
                        value={formData.type}
                        onChange={(e) => setFormData({ ...formData, type: e.target.value })}
                        className="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-indigo-500"
                      >
                        <option value="AUTO">智能自动推断</option>
                        <option value="WEBM">WebM 动态视频</option>
                        <option value="IMG">静态图片 / WebP / PNG</option>
                        <option value="GIF">GIF 动图</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-medium text-slate-300 mb-1">备注说明</label>
                    <textarea
                      rows={2}
                      placeholder="记录该网址的特点或灵感用途..."
                      value={formData.description}
                      onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                      className="w-full bg-slate-900 border border-slate-700 text-slate-200 text-xs rounded-xl px-3.5 py-2.5 focus:outline-none focus:border-indigo-500"
                    />
                  </div>

                  <div className="flex items-center gap-2 pt-1">
                    <input
                      type="checkbox"
                      id="manual-pin-chk"
                      checked={formData.isPinned}
                      onChange={(e) => setFormData({ ...formData, isPinned: e.target.checked })}
                      className="rounded bg-slate-900 border-slate-700 text-indigo-600 focus:ring-indigo-500"
                    />
                    <label htmlFor="manual-pin-chk" className="text-xs text-slate-300 cursor-pointer">
                      在画廊库中置顶展示此网址
                    </label>
                  </div>

                  <div className="flex items-center justify-end gap-3 pt-4 border-t border-slate-800">
                    <button
                      type="button"
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 rounded-xl text-xs text-slate-400 hover:text-white"
                    >
                      取消
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2.5 rounded-xl text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/30"
                    >
                      确认添加
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* 全屏高清预览 Lightbox */}
          {activePreviewItem && (
            <div
              className="fixed inset-0 z-50 flex items-center justify-center p-4 sm:p-6 bg-black/90 backdrop-blur-md"
              onClick={() => setActivePreviewItem(null)}
            >
              <div
                className="relative max-w-4xl w-full glass-panel rounded-3xl overflow-hidden border border-slate-700/80 flex flex-col max-h-[92vh]"
                onClick={(e) => e.stopPropagation()}
              >
                <div className="p-4 flex items-center justify-between border-b border-slate-800 bg-slate-900/60">
                  <div className="flex items-center gap-2">
                    <span className="px-2 py-0.5 rounded text-[10px] font-bold bg-indigo-600/30 text-indigo-300">
                      {activePreviewItem.type}
                    </span>
                    <h3 className="text-base font-bold text-slate-200">{activePreviewItem.title}</h3>
                  </div>
                  <div className="flex items-center gap-2">
                    <button
                      onClick={(e) => handleDownloadAsset(activePreviewItem, e)}
                      className="px-3 py-1 bg-cyan-600 text-white rounded-lg text-xs hover:bg-cyan-500 font-medium"
                    >
                      ⬇ 下载保存
                    </button>
                    <button
                      onClick={() => setActivePreviewItem(null)}
                      className="text-slate-400 hover:text-white text-base p-1"
                    >
                      ✕
                    </button>
                  </div>
                </div>

                <div className="flex-1 bg-slate-950 flex items-center justify-center p-4 overflow-hidden min-h-[350px]">
                  <MediaRenderer
                    url={activePreviewItem.url}
                    previewUrl={activePreviewItem.previewUrl}
                    type={activePreviewItem.type}
                    title={activePreviewItem.title}
                    className="max-h-[65vh] max-w-full object-contain rounded-xl shadow-2xl"
                  />
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
